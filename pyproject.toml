[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keygate-cli"
version = "0.1.0"
description = "AI agents use your secrets without seeing them — Bitwarden-backed secret injection + output scrubbing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "feelgom" }]
keywords = ["secrets", "credentials", "bitwarden", "ai-agents", "claude", "cursor", "codex", "security", "key-amnesia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = [
    "pyperclip>=1.8",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
vault = ["pynacl>=1.5"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/feelgom/keygate"
Repository = "https://github.com/feelgom/keygate"
Issues = "https://github.com/feelgom/keygate/issues"
Upstream = "https://github.com/fujitoid/key-amnesia"

[project.scripts]
keygate = "key_amnesia.cli:main"
kg = "key_amnesia.cli:main"
keygate-hook = "key_amnesia.hooks.secret_guard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
key_amnesia = ["skills/*/SKILL.md", "hooks/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: process-spawning or otherwise heavy tests; skip with -m 'not slow' for a fast inner loop",
]
