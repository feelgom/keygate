name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual re-run after GitHub Actions infra flakes without a no-op commit.
  # UI: Actions → tests → Run workflow → master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    # Cap hung runners during Actions capacity incidents (macos can sit
    # "in_progress" for an hour+ with no progress while the matrix is red).
    timeout-minutes: 30
    # No marketplace `uses:` steps: during Actions partial/major outages,
    # "Set up job" fails while resolving action download info even before
    # checkout. Prefer toolcache Python + git fetch; install via uv on miss
    # (macos-latest toolcache currently ships 3.11+ only, not 3.10).
    # uv-managed Pythons are PEP 668 externally-managed — use a seeded venv.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Select Python ${{ matrix.python-version }}
        id: py
        run: |
          set -euo pipefail
          VER="${{ matrix.python-version }}"
          case "${{ runner.os }}" in
            Linux)   BASE="/opt/hostedtoolcache/Python" ;;
            macOS)   BASE="/Users/runner/hostedtoolcache/Python" ;;
            Windows) BASE="/c/hostedtoolcache/windows/Python" ;;
            *) echo "unsupported OS ${{ runner.os }}" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) ARCH=x64 ;;
            arm64|aarch64) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac

          find_toolcache() {
            local cand
            cand=$(ls -d "${BASE}/${VER}".*/${ARCH} 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -z "${cand}" ]; then
              cand=$(ls -d "${BASE}/${VER}".*/* 2>/dev/null | sort -V | tail -n 1 || true)
            fi
            printf '%s' "${cand}"
          }

          resolve_bin() {
            local cand="$1"
            if [ "${{ runner.os }}" = "Windows" ]; then
              printf '%s' "${cand}/python.exe"
            else
              printf '%s' "${cand}/bin/python"
            fi
          }

          CAND=$(find_toolcache)
          if [ -n "${CAND}" ]; then
            PY=$(resolve_bin "${CAND}")
          else
            # uv-managed interpreters are PEP 668 externally-managed; pip needs a venv.
            echo "No toolcache Python ${VER} under ${BASE}; installing via uv + venv" >&2
            ls -la "${BASE}" >&2 || true
            if ! command -v uv >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="${HOME}/.local/bin:${HOME}/.cargo/bin:${PATH}"
            fi
            # Windows GitHub bash: uv often lands in USERPROFILE\.local\bin
            if ! command -v uv >/dev/null 2>&1; then
              export PATH="${USERPROFILE}/.local/bin:${PATH}"
            fi
            command -v uv
            uv python install "${VER}"
            VENV="${RUNNER_TEMP}/ka-py${VER}"
            # --seed installs pip so later `python -m pip` works (uv venvs omit it by default).
            uv venv --seed --python "${VER}" "${VENV}"
            if [ "${{ runner.os }}" = "Windows" ]; then
              PY="${VENV}/Scripts/python.exe"
            else
              PY="${VENV}/bin/python"
            fi
          fi

          if [ ! -x "${PY}" ] && [ ! -f "${PY}" ]; then
            echo "Python binary missing: ${PY}" >&2
            exit 1
          fi
          echo "python=${PY}" >> "$GITHUB_OUTPUT"
          "${PY}" -V

      - name: Install
        run: |
          set -euo pipefail
          PY="${{ steps.py.outputs.python }}"
          "${PY}" -m pip install -U pip
          "${PY}" -m pip install -e ".[dev]"

      - name: Test
        run: |
          set -euo pipefail
          PY="${{ steps.py.outputs.python }}"
          "${PY}" -m pytest -q
